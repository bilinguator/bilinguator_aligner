[project]
name = "bilinguator-aligner"
version = "1.0"
description = "Browser-based tool for creating bilingual books from parallel texts"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10,<3.11"
authors = [
    { name = "Bilinguator", email = "bilinguator@gmail.com" },
]
keywords = ["bilingual", "parallel-text", "alignment", "languages", "txt", "fb2", "epub", "pdf"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Framework :: Flask",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.10",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = [
    "dateparser==1.1.8",
    "flask==3.1.0",
    "huggingface-hub==0.13.4",
    "lingtrain-aligner==0.8.7",
    "markupsafe==2.1.3",
    "matplotlib==3.7.1",
    "numpy==1.24.2",
    "python-dateutil==2.8.2",
    "razdel==0.5.0",
    "sentence-transformers==2.2.2",
    "tqdm==4.66.5",
    "transformers==4.28.1",
]

[project.urls]
Homepage = "https://bilinguator.com"
Repository = "https://github.com/bilinguator/bilinguator_aligner"
Issues = "https://github.com/bilinguator/bilinguator_aligner/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["utils"]
include = [
    "bilinguator_aligner.py",
    "static/**",
    "templates/**",
    "utils/**",
    "VERSION",
    "HELP",
]

[tool.uv]
# Гарантирует разрешение зависимостей строго под целевую версию Python из install.sh
environments = ["python_version == '3.10'"]