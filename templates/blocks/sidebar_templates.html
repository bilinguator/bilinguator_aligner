<template id="apostroph">
    <div class="sidebar-header">
        <img src="{{ url_for('static', filename='img/apostroph.png') }}" class="panel-button-img">
        <h2 class="sidebar-heading"></h1>
    </div>
    <div class="sidebar-main-area">
        <div class="sidebar-horizontal-container sidebar-margin-top">
            <p class="sidebar-p sidebar-margin-top">Typewriter apostrophes</p>
            <div class="sidebar-horizontal-container">
                <p class="sidebar-p sidebar-count" id="typewriter-apostrophes-count"></p>
                <textarea class="sidebar-textarea sidebar-oneline-textarea sidebar-mini-textarea sidebar-textarea-readonly" onclick="search('\'', isRegex=false);copyToClipboard('\'');" readonly>'</textarea>
            </div>
        </div>
        <div class="sidebar-horizontal-container sidebar-margin-top">
            <p class="sidebar-p sidebar-margin-top">Punctuation apostrophes</p>
            <div class="sidebar-horizontal-container">
                <p class="sidebar-p sidebar-count" id="punctuation-apostrophes-count"></p>
                <textarea class="sidebar-textarea sidebar-oneline-textarea sidebar-mini-textarea sidebar-textarea-readonly" onclick="search('’', isRegex=false);copyToClipboard('’');" readonly>’</textarea>
            </div>
        </div>
        
        <div class="sidebar-vertical-container sidebar-margin-top">
            <button class="sidebar-button book-panel-button sidebar-margin-top" onclick="replaceApostrophesAutomatically(lang = 'en');">Replace English apostrophes</button>
            <button class="sidebar-button book-panel-button sidebar-margin-top" onclick="replaceApostrophesAutomatically(lang = 'fr');">Replace French apostrophes</button>
            <button class="sidebar-button book-panel-button sidebar-margin-top" onclick="replaceApostrophesAutomatically(lang = null);">Replace in-word apostrophes</button>
            <button class="sidebar-button book-panel-button sidebar-margin-top" onclick="replaceAllApostrophes();">Replace all</button>
            <button class="sidebar-button book-panel-button sidebar-margin-top" onclick="toManualReplacement('\'', '’')">Replace manually</button>
        </div>
    </div>
</template>

<template id="ellipsis">
    <div class="sidebar-header">
        <img src="{{ url_for('static', filename='img/ellipsis.png') }}" class="panel-button-img">
        <h1 class="sidebar-heading"></h1>
    </div>
    <div class="sidebar-main-area">
        <div class="sidebar-horizontal-container sidebar-margin-top">
            <p class="sidebar-p sidebar-count" id="three-dots-with-spaces-count"></p>
            <textarea class="sidebar-textarea sidebar-oneline-textarea sidebar-mini-textarea sidebar-textarea-readonly ellipsis-textarea" onclick="search('. . .', isRegex=false);copyToClipboard('. . .');" title="Three dots with spaces" readonly>. . .</textarea>
            <p class="sidebar-p sidebar-count" id="three-dots-count"></p>
            <textarea class="sidebar-textarea sidebar-oneline-textarea sidebar-mini-textarea sidebar-textarea-readonly ellipsis-textarea" onclick="search('...', isRegex=false);copyToClipboard('...');" title="Three dots" readonly>...</textarea>
            <p class="sidebar-p sidebar-count" id="midline-ellipses-count"></p>
            <textarea class="sidebar-textarea sidebar-oneline-textarea sidebar-mini-textarea sidebar-textarea-readonly ellipsis-textarea" onclick="search('⋯', isRegex=false);copyToClipboard('⋯');" title="Midline ellipsis" readonly>⋯</textarea>
            <p class="sidebar-p sidebar-count" id="ellipses-count"></p>
            <textarea class="sidebar-textarea sidebar-oneline-textarea sidebar-mini-textarea sidebar-textarea-readonly ellipsis-textarea" onclick="search('…', isRegex=false);copyToClipboard('…');" title="Ellipsis" readonly>…</textarea>
        </div>
        <div class="sidebar-horizontal-container sidebar-margin-top" style="justify-content: space-evenly!important;">
            <div class="sidebar-horizontal-container">
                <p class="sidebar-p sidebar-count sidebar-margin-top">Search</p>
                <textarea class="sidebar-textarea sidebar-oneline-textarea sidebar-mini-textarea sidebar-margin-top" id="ellipses-search-textarea" rows="1">...</textarea>
            </div>
            <div class="sidebar-horizontal-container">
                <p class="sidebar-p sidebar-count sidebar-margin-top">Replace</p>
                <textarea class="sidebar-textarea sidebar-oneline-textarea sidebar-mini-textarea sidebar-margin-top" id="ellipses-replace-textarea" rows="1">…</textarea>
            </div>
        </div>
        <div class="sidebar-vertical-container sidebar-margin-top">
            <button class="sidebar-button book-panel-button sidebar-margin-top" onclick="replaceAllEllipses()">Replace automatically</button>
            <button class="sidebar-button book-panel-button sidebar-margin-top" onclick="toEllipsisManualReplacement()">Replace manually</button>
        </div>
    </div>
</template>


<template id="tag_headings">
    <div class="sidebar-header">
        <img src="{{ url_for('static', filename='img/tag_headings.png') }}" class="panel-button-img">
        <h1 class="sidebar-heading"></h1>
    </div>
    <div class="sidebar-main-area">
        <p class="sidebar-p sidebar-margin-top">Chapter word</p>
        <textarea class="sidebar-textarea sidebar-oneline-textarea sidebar-margin-top" id="chapter-word-textarea" rows="1" oninput="updateHeadingExample()"></textarea>
        <p class="sidebar-p sidebar-margin-top">Numbering</p>
        <select class="sidebar-textarea sidebar-oneline-textarea sidebar-margin-top" id="numbering-select" onchange="updateHeadingExample()">
            <option value="arabic">Arabic: 0123456789</option>
            <option value="abjad">Abjad: أبجدﻩوﺯﺡﻁﻱﻙﻝﻡﻥﺱﻉﻑصﻕﺭﺵﺕﺙﺥﺫﺽﻅﻍ</option>
            <option value="amharic">Amharic: ፩፪፫፬፭፮፯፰፱፲፳፴፵፶፷፸፹፺፻፼</option>
            <option value="bengali">Bengali: ০১২৩৪৫৬৭৮৯</option>
            <option value="burmese">Burmese: ၀၁၂၃၄၅၆၇၈၉</option>
            <option value="chinese">Chinese: 一二三四五六七八九十</option>
            <option value="devanagari">Devanagari: ०१२३४५६७८९</option>
            <option value="eastern-arabic">Eastern Arabic: ۱۲۳٤۴٥۵</option>
            <option value="kannada">Kannada: ೦೧೨೩೪೫೬೭೮೯</option>
            <option value="khmer">Khmer: ០១២៣៤៥៦៧៨៩</option>
            <option value="lao">Lao: ໐໑໒໓໔໕໖໗໘໙</option>
            <option value="malayalam">Malayalam: ൦൧൨൩൪൫൬൭൮൯൰൱൲</option>
            <option value="mongolian">Mongolian: ᠐᠑᠒᠓᠔᠕᠖᠗᠘᠙</option>
            <option value="odia">Odia: ୦୧୨୩୪୫୬୭୮୯</option>
            <option value="roman">Roman: IVXLCDM</option>
            <option value="tamil">Tamil: ௦௧௨௩௪௫௬௭௮௯</option>
            <option value="telugu">Telugu: ౦౧౨౩౪౫౬౭౮౯</option>
            <option value="text">Text: one, two, three, four, five, six, seven, eight, nine</option>
            <option value="tibetan">Tibetan: ༠༡༢༣༤༥༦༧༨༩</option>
            <option value="thai">Thai: ๐๑๒๓๔๕๖๗๘๙</option>
            <option value="limbu">Limbu: ᥆᥇᥈᥉᥊᥋᥌᥍᥎᥏</option>
        </select>
        <p class="sidebar-p sidebar-margin-top">Delimiter between numbering and title</p>
        <textarea class="sidebar-textarea sidebar-oneline-textarea sidebar-margin-top" id="numbering-delimiter-textarea" rows="1" oninput="updateHeadingExample()"></textarea>
        
        <input type="checkbox" class="sidebar-margin-top" id="with-title-checkbox" name="with-title-checkbox" onchange="updateHeadingExample()">
        <label for="with-title-checkbox" class="sidebar-p" id="with-title-checkbox-label">With title</label>
        
        <input type="checkbox" class="sidebar-margin-top" id="numbering-first-checkbox" name="numbering-first-checkbox" onchange="updateHeadingExample()">
        <label for="numbering-first-checkbox" class="sidebar-p" id="numbering-first-checkbox-label">Numbering first</label>
        
        <p class="sidebar-p sidebar-margin-top">Example: <span class="sidebar-message" id="heading-example"></span></p>
        
        <div class="sidebar-vertical-container sidebar-margin-top">
            <button class="sidebar-button book-panel-button sidebar-margin-top" onclick="detectHeadingsByParameters()">Search by parameters</button>
            <button class="sidebar-button book-panel-button sidebar-margin-top" onclick="searchUpperCaseHeadings()">Search uppercase headings</button>
        </div>

        <textarea class="sidebar-textarea sidebar-multiline-textarea sidebar-margin-top" id="headings-textarea" onclick="searchLineFromTextarea(fullLineMatch = true);this.focus();"></textarea>
        <p class="sidebar-message sidebar-margin-top" id="headings-count-message"></p>
        <div class="sidebar-vertical-container sidebar-margin-top">
            <button class="sidebar-button book-panel-button sidebar-margin-top" onclick="tagHeadings()">Tag headings</button>
        </div>
    </div>
</template>


<template id="merge_strophes_by_delimiter">
    <div class="sidebar-header">
        <img src="{{ url_for('static', filename='img/merge_strophes_by_delimiter.png') }}" class="panel-button-img">
        <h1 class="sidebar-heading"></h1>
    </div>
    <div class="sidebar-main-area">
        <p class="sidebar-p sidebar-margin-top">Delimiter</p>
        <textarea class="sidebar-textarea sidebar-oneline-textarea sidebar-margin-top" id="delimiter-textarea" rows="1"><delimiter></textarea>
        <p class="sidebar-p sidebar-margin-top">Minimum line breaks among strophes</p>
        <textarea class="sidebar-textarea sidebar-oneline-textarea sidebar-margin-top" id="minimum-line-breaks-textarea" oninput="mergeStrophesByDelimiter(test = true);" rows="1">2</textarea>
        <p class="sidebar-p sidebar-margin-top">Start line</p>
        <textarea class="sidebar-textarea sidebar-oneline-textarea sidebar-margin-top" id="start-line-textarea" oninput="mergeStrophesByDelimiter(test = true);" rows="1">3</textarea>
        
        <p class="sidebar-p sidebar-margin-top">Paragraphs number before: <span class="sidebar-message" id="paragraphs-number-before"></span></p>
        <p class="sidebar-p sidebar-margin-top">Paragraphs number after: <span class="sidebar-message" id="paragraphs-number-after"></span></p>

        <div class="sidebar-vertical-container sidebar-margin-top">
            <button class="sidebar-button book-panel-button sidebar-margin-top" onclick="mergeStrophesByDelimiter(test = false);">Apply</button>
        </div>
        
        <p class="sidebar-p sidebar-margin-top">Other functions</p>
        <div class="sidebar-vertical-container sidebar-margin-top">
            <button class="sidebar-button book-panel-button sidebar-margin-top" onclick="removeEmptyLines();">Remove empty lines</button>
            <button class="sidebar-button book-panel-button sidebar-margin-top" onclick="mergeLinesWithoutOpeningTags();">Merge lines without opening tags</button>
        </div>
    </div>
</template>
