<template id="remove_page_numbers">
    <div class="sidebar-header">

<template id="remove_notes">
    <div class="sidebar-header">
        <img src="{{ url_for('static', filename='img/remove_notes.png') }}" class="panel-button-img">
        <h2 class="sidebar-heading"></h1>
    </div>
    <div class="sidebar-main-area">
        <p class="sidebar-p sidebar-margin-top">Note numberings detected</p>
        <textarea class="sidebar-textarea sidebar-margin-top" id="note-numberings-textarea" onclick="searchLineFromTextarea();this.focus();"></textarea>
        <p class="sidebar-message sidebar-margin-top"></p>
        <div class="sidebar-vertical-container sidebar-margin-top">
            <button class="sidebar-button book-panel-button sidebar-margin-top" onclick="detectNotes()">Detect</button>
            <button class="sidebar-button book-panel-button sidebar-margin-top" onclick="removeNotes()">Remove</button>
        </div>
    </div>
</template>
