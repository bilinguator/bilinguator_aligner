{% macro languages_dropdown_list(side, text, languages, lang) %}
    <label class="language-label" for="languages-dropdown-list-{{ side }}">
        Language
    </label>
    <select class="languages-dropdown-list languages-dropdown-list-{{ side }}" id="languages-dropdown-list-{{ side }}">
        <option value="--">--</option>
        {% for language_iso_code, language_name in languages.items() %}
            <option value="{{ language_iso_code }}"{{ ' selected' if lang == language_iso_code else '' }}>{{ language_name }}</option>
        {% endfor %}
    </select>
{% endmacro %}
